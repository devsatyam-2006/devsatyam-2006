name: Coding Quote

on:
  schedule:
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Quote
        run: |
          mkdir -p activity

          curl -fsSL --retry 3 \
            https://programming-quotesapi.vercel.app/api/random \
            -o quote.json

          node -e '
            const fs = require("fs");
            const q = JSON.parse(fs.readFileSync("quote.json"));
            const quote = q.quote || q.en;

            if (!quote) throw new Error("Invalid quote");

            const content = `# Daily Programming Quote

          > "${quote}"

          **— ${q.author || "Unknown"}**

          Updated: ${new Date().toUTCString()}
          `;

            fs.writeFileSync("activity/quote.md", content);
          '

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity/quote.md
          git commit -m "chore: update daily coding quote" || exit 0
          git push
          
