name: Coding Quote

on:
  schedule:
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch Quote
        run: |
          mkdir -p activity

          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/mudroljub/programming-quotes-api/refs/heads/master/data/quotes.json \
            -o quotes.json

          node -e '
            const fs = require("fs");
            const quotes = JSON.parse(
              fs.readFileSync("quotes.json", "utf8")
            );

            if (!Array.isArray(quotes) || quotes.length === 0) {
              throw new Error("Invalid quotes dataset");
            }

            const q = quotes[Math.floor(Math.random() * quotes.length)];

            const quote = q.text || q.en || q.quote;
            const author = q.author || "Unknown";

            if (!quote) {
              throw new Error("Invalid quote");
            }

            const content = `# Daily Programming Quote

          > "${quote}"

          **— ${author}**
          `;

            fs.writeFileSync("activity/quote.md", content);
          '

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity/quote.md
          git commit -m "chore: update daily coding quote" || exit 0
          git push
          
